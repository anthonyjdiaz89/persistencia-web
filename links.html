  h1 { font-size: 21px; font-weight: 800; letter-spacing: 0.02em; margin-top: 14px; }
  h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { font-size: 13.5px; color: var(--fg-dim); margin: 6px 0 30px; text-align: center; }
  .lista { width: 100%; max-width: 430px; display: grid; gap: 14px; }

    border: 1px solid var(--border); background: var(--surface);
    transition: transform 0.25s var(--ease), background 0.25s, border-color 0.25s;
  }
  a.enlace:hover { transform: translateY(-3px); background: rgba(255,255,255,0.09); border-color: rgba(77,238,234,0.5); }
  a.enlace.principal { background: var(--grad); color: #06060c; border: none; }
  a.enlace.principal:hover { filter: brightness(1.1); }
  a.enlace svg { width: 22px; height: 22px; flex: none; }
  a.enlace small { display: block; font-weight: 500; font-size: 12.5px; opacity: 0.75; margin-top: 2px; }

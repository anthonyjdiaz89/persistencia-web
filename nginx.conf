server {
  listen 80;
  server_name persistenciadigital.com;
  root /usr/share/nginx/html;
  index index.html;

  # tipos que nginx no trae de fábrica (modelos y ML del sitio)
  types {
    text/html html;
    text/css css;
    application/javascript js mjs;
    image/webp webp;
    image/jpeg jpg jpeg;
    image/png png;
    image/svg+xml svg;
    video/mp4 mp4;
    model/gltf-binary glb;
    application/octet-stream task tflite mind wasm bin;
    application/xml xml;
    text/plain txt;
  }

  gzip on;
  gzip_types text/css application/javascript application/xml text/plain image/svg+xml;

  # estáticos con caché larga; html siempre fresco
  location ~* \.(jpg|jpeg|png|webp|svg|mp4|glb|task|tflite|mind|wasm|js|mjs|css)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}

# www redirige al apex (mantiene la regla del dominio principal)
server {
  listen 80;
  server_name www.persistenciadigital.com;
  return 308 https://persistenciadigital.com$request_uri;
}

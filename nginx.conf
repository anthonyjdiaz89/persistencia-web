server {
  listen 80;
  server_name persistenciadigital.com;
  root /usr/share/nginx/html;
  index index.html;

  # tipos que nginx no trae de fábrica (modelos y ML del sitio)
  types {
    text/html html;
    text/css css;
    application/javascript js mjs;
    image/webp webp;
    image/jpeg jpg jpeg;
    image/png png;
    image/svg+xml svg;
    video/mp4 mp4;
    model/gltf-binary glb;
    application/octet-stream task tflite mind wasm bin;
    application/xml xml;
    application/json json;
    text/plain txt;
  }

  gzip on;
  gzip_types text/css application/javascript application/xml text/plain image/svg+xml application/manifest+json;

  error_page 404 /404.html;

  # estáticos con caché larga; html siempre fresco
  # El ^(?!/admin/) deja FUERA al panel: en nginx un bloque de regex le gana a
  # uno de prefijo, asi que sin esto panel.js y panel.css caerian en la cache
  # de 30 dias y un arreglo del panel tardaria un mes en verse.
  location ~* ^(?!/admin/).*\.(jpg|jpeg|png|webp|svg|mp4|glb|task|tflite|mind|wasm|js|mjs|css)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }
  # El panel de presupuestos y cotizaciones. nginx sigue sirviendo el sitio
  # entero como siempre; solo /api va al proceso de Node, que es el unico que
  # tiene la llave de la base. Si ese proceso se cae, el sitio sigue en pie y
  # solo deja de responder el panel.
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # La descarga de Excel y la subida de un libro no pasan por el buffer:
    # con buffering nginx espera el archivo entero antes de empezar.
    proxy_buffering off;
    client_max_body_size 25m;
    proxy_read_timeout 120s;
  }

  # El panel no se indexa: es parte del sitio pero no del escaparate.
  location /admin/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /admin/index.html;
  }

  # url limpia para la pagina de enlaces (bio de redes)
  location = /links {
    add_header Cache-Control "no-cache";
    try_files /links.html =404;
  }
  # Urls limpias para todas las paginas: /eventos sirve eventos.html sin
  # necesitar un bloque por pagina. Antes cada url limpia exigia su propio
  # `location =` y por eso /eventos daba 404 recien publicado (2026-08-19).
  # El $uri.html va DESPUES de $uri para que un archivo real siempre gane.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/ =404;
  }
}

# www redirige al apex (mantiene la regla del dominio principal)
server {
  listen 80;
  server_name www.persistenciadigital.com;
  return 308 https://persistenciadigital.com$request_uri;
}

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Página no encontrada | Persistencia Digital</title>
<link rel="icon" type="image/webp" href="/assets/isotipo.webp" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --grad: linear-gradient(90deg, #4deeea, #3d5afe 45%, #d94de8); }
  body {
    font-family: "Inter", "Segoe UI", system-ui, sans-serif; background: #06060c; color: #f4f6ff;
    min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
  }
  .banda { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--grad); }
  img { width: 84px; margin-bottom: 22px; filter: drop-shadow(0 0 30px rgba(77,238,234,0.35)); }
  h1 { font-size: clamp(56px, 12vw, 110px); font-weight: 850; letter-spacing: -0.03em;
       background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { color: rgba(244,246,255,0.66); margin: 12px auto 30px; max-width: 420px; line-height: 1.6; }
  a {
    display: inline-block; padding: 14px 30px; border-radius: 999px; font-weight: 800; font-size: 15px;
    text-decoration: none; color: #06060c; background: var(--grad);
  }
</style>
</head>
<body>
<div class="banda"></div>
<main>
  <img src="/assets/isotipo.webp" alt="" />
  <h1>404</h1>
  <p>Esta experiencia no existe — o todavía no la hemos creado. Lo que sí existe está en el catálogo.</p>
  <a href="/">Volver al catálogo</a>
</main>
</body>
</html>
